          - Surveillance d’un examen en direct: user-guides/manager/live-exam-proctoring.md
      - Administrateurs:
          - Utilisateurs et rôles de compte: user-guides/administration/users-and-roles.md
          - Cercles et autorisations: user-guides/administration/circles-and-permissions.md
          - Paramètres et identité visuelle de l'organisation: user-guides/administration/organization-settings.md
  - Intégrations:
      - Moodle LMS: integrations/moodle-lms.md
      - Canvas LMS: integrations/canvas-lms.md
      - Blackboard Learn Ultra: integrations/blackboard-lms.md
      - Flux de travail développeur: integrations/developer-workflow.md
      - Sandbox développeur: integrations/developer-sandbox.md
      - Démarrage rapide avec l'API sandbox: integrations/sandbox-api-quickstart.md
      - Clés API et webhooks: integrations/api-keys-and-webhooks.md
      - Intégrer l'application Client: integrations/embedding-client-app.md
  - Référence API: api/index.md

