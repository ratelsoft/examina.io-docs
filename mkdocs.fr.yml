      - Rôles et autorisations: getting-started/roles-and-permissions.md
  - Guides d'utilisation:
      - Client:
          - Passer un examen: user-guides/client/take-an-exam.md
          - Résolution des problèmes le jour de l'examen: user-guides/client/troubleshooting.md
          - Page de connexion personnalisée: user-guides/client/custom-login-page.md
      - Designer:
          - Présentation de Designer: user-guides/designer/introduction.md
          - L'examen: user-guides/designer/exam.md
          - Le sujet: user-guides/designer/paper.md
          - Créer des questions: user-guides/designer/questions.md
          - Créer des questions avec l'IA: user-guides/designer/ai-question-authoring.md
          - Importer du contenu existant: user-guides/designer/import-content.md
          - Réutiliser le contenu d'un projet: user-guides/designer/importing-questions.md
      - Manager:
          - Présentation de Manager: user-guides/manager/overview.md
          - Importer des examens: user-guides/manager/import-exams.md
          - Ajouter et importer des candidats: user-guides/manager/examinees.md
          - Groupes et affectations d'examens: user-guides/manager/groups-and-assignments.md
          - Envoyer un courriel aux candidats: user-guides/manager/email-examinees.md
