site_name: examina.io Docs
site_url: https://docs.examina.io/
site_description: Guides and API reference for creating, managing, delivering, and integrating secure online assessments with examina.io.
site_author: Ratelsoft Inc.
repo_url: https://github.com/ratelsoft/examina.io-docs
repo_name: ratelsoft/examina.io-docs
edit_uri: edit/main/docs/
copyright: >-
  Copyright &copy; 2026 Ratelsoft Inc. &nbsp;&middot;&nbsp;
  <a href="https://www.examina.io/terms">Terms</a> &nbsp;&middot;&nbsp;
  <a href="https://www.examina.io/privacy">Privacy</a>

docs_dir: docs
site_dir: site
use_directory_urls: true
exclude_docs: |
  drafts/
  404.md

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.ico
  font:
    # Body face of the 2026 brand. Outfit is used for headings and is loaded in
    # stylesheets/extra.css, since Material only manages a single text family.
    text: Plus Jakarta Sans
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

nav:
  - Home: index.md
  - Getting started:
      - Quick start: getting-started/quick-start.md
      - Platform overview: getting-started/overview.md
      - Roles and permissions: getting-started/roles-and-permissions.md
  - User guides:
      - Client:
          - Take an exam: user-guides/client/take-an-exam.md
          - Test-day troubleshooting: user-guides/client/troubleshooting.md
          - Custom exam login page: user-guides/client/custom-login-page.md
      - Designer:
          - Introducing Designer: user-guides/designer/introduction.md
          - The exam: user-guides/designer/exam.md
          - The paper: user-guides/designer/paper.md
          - Creating questions: user-guides/designer/questions.md
          - Create questions with AI: user-guides/designer/ai-question-authoring.md
          - Import existing content: user-guides/designer/import-content.md
          - Reuse project content: user-guides/designer/importing-questions.md
      - Manager:
          - Manager overview: user-guides/manager/overview.md
          - Import exams: user-guides/manager/import-exams.md
          - Add and import examinees: user-guides/manager/examinees.md
          - Groups and exam assignments: user-guides/manager/groups-and-assignments.md
          - Email your examinees: user-guides/manager/email-examinees.md
          - Deliver, monitor, and report: user-guides/manager/deliver-monitor-report.md
          - eFaceID identity verification: user-guides/manager/efaceid-identity-verification.md
          - Live exam proctoring: user-guides/manager/live-exam-proctoring.md
      - Administrators:
          - Users and account roles: user-guides/administration/users-and-roles.md
          - Circles and permissions: user-guides/administration/circles-and-permissions.md
          - Organization settings and branding: user-guides/administration/organization-settings.md
  - Integrations:
      - Moodle LMS: integrations/moodle-lms.md
      - Canvas LMS: integrations/canvas-lms.md
      - Blackboard Learn Ultra: integrations/blackboard-lms.md
      - Developer workflow: integrations/developer-workflow.md
      - Developer sandbox: integrations/developer-sandbox.md
      - Sandbox API quickstart: integrations/sandbox-api-quickstart.md
      - API keys and webhooks: integrations/api-keys-and-webhooks.md
      - Embed the client app: integrations/embedding-client-app.md
  - API reference: api/index.md

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/language-routing.js

extra:
  generator: false
  canonical_root: https://docs.examina.io
  social_image_alt: examina.io assessment applications
  alternate:
    - name: English
      link: /
      lang: en
    - name: Français
      link: /fr/
      lang: fr
    - name: العربية
      link: /ar/
      lang: ar
    - name: Español (Latinoamérica)
      link: /es-419/
      lang: es-419
    - name: Português (Brasil)
      link: /pt-br/
      lang: pt-BR
  social:
    - icon: fontawesome/solid/globe
      link: https://www.examina.io/
      name: examina.io website
    - icon: fontawesome/brands/github
      link: https://github.com/ratelsoft
      name: Ratelsoft on GitHub
