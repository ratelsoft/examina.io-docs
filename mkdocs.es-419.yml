      - Designer:
          - Introducción a Designer: user-guides/designer/introduction.md
          - El examen: user-guides/designer/exam.md
          - El cuestionario: user-guides/designer/paper.md
          - Crear preguntas: user-guides/designer/questions.md
          - Crear preguntas con IA: user-guides/designer/ai-question-authoring.md
          - Importar contenido existente: user-guides/designer/import-content.md
          - Reutilizar contenido del proyecto: user-guides/designer/importing-questions.md
      - Manager:
          - Descripción general de Manager: user-guides/manager/overview.md
          - Importar exámenes: user-guides/manager/import-exams.md
          - Agregar e importar candidatos: user-guides/manager/examinees.md
          - Grupos y asignaciones de exámenes: user-guides/manager/groups-and-assignments.md
          - Enviar correos a candidatos: user-guides/manager/email-examinees.md
